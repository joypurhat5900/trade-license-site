<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>লগইন</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header><h1>ট্রেড লাইসেন্স রেকর্ড</h1><span class="note">লগইন প্রয়োজন</span></header>
  <form id="loginForm" class="card" autocomplete="on">
    <h2>লগইন</h2>
    <div class="pad">
      <label for="lu">ইউজারনেম</label><input id="lu" name="username" autocomplete="username" required>
      <label for="lp">পাসওয়ার্ড</label><input id="lp" name="password" type="password" autocomplete="current-password" required>
      <p id="lerr" class="msg bad" style="display:none;padding:8px 0 0">ইউজারনেম বা পাসওয়ার্ড ভুল</p>
      <button type="submit" class="primary" style="width:100%;margin-top:14px">প্রবেশ করুন</button>
    </div>
  </form>
</div>
<script src="auth.js"></script>
<script>
const $=s=>document.querySelector(s);
function nextPage(){
  const n=new URLSearchParams(location.search).get("next")||"";
  return /^[\w-]+\.html(\?[\w=%&.\-]*)?$/.test(n)&&!n.startsWith("login")?n:"index.html";
}
if(isLoggedIn())location.replace(nextPage());
$("#loginForm").onsubmit=async e=>{
  e.preventDefault();
  if(await tryLogin($("#lu").value,$("#lp").value))location.replace(nextPage());
  else{await new Promise(r=>setTimeout(r,1000));$("#lerr").style.display="";$("#lp").value=""}
};
</script>
</body>
</html>
