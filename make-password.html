<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নতুন পাসওয়ার্ড তৈরি</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header><h1>নতুন ইউজারনেম ও পাসওয়ার্ড</h1></header>
  <form id="f" class="card">
    <h2>পাসওয়ার্ড তৈরি</h2>
    <div class="pad">
      <label>ইউজারনেম</label><input id="u" required>
      <label>পাসওয়ার্ড</label><input id="p" type="password" required minlength="6">
      <button class="primary" style="width:100%;margin-top:14px" type="submit">কোড তৈরি করুন</button>
    </div>
  </form>
  <div id="out" class="card hidden">
    <div class="pad">
      <p>নিচের লাইনটি কপি করে <b>auth.js</b> ফাইলের <code>const AUTH_HASH=...</code> লাইনের জায়গায় বসান, তারপর GitHub-এ auth.js আপডেট করুন।</p>
      <input id="line" readonly onclick="this.select()">
      <button id="copy" style="margin-top:10px;width:100%">কপি করুন</button>
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script>
const $=s=>document.querySelector(s);
$("#f").onsubmit=async e=>{
  e.preventDefault();
  const h=await makeHash($("#u").value,$("#p").value);
  $("#line").value=`const AUTH_HASH="${h}";`;
  $("#out").classList.remove("hidden");
};
$("#copy").onclick=()=>{navigator.clipboard.writeText($("#line").value);$("#copy").textContent="কপি হয়েছে ✓"};
</script>
</body>
</html>
