<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নতুন পাসওয়ার্ড তৈরি</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header><h1>নতুন ইউজারনেম ও পাসওয়ার্ড</h1></header>
  <form id="f" class="card">
    <h2>পাসওয়ার্ড তৈরি</h2>
    <div class="pad">
      <label>ইউজারনেম</label><input id="u" required>
      <label>পাসওয়ার্ড</label><input id="p" type="password" required minlength="6">
      <button class="primary" style="width:100%;margin-top:14px" type="submit">কোড তৈরি করুন</button>
    </div>
  </form>
  <div id="out" class="card hidden">
    <div class="pad">
      <p>নিচের লাইনটি কপি করে <b>auth.js</b> ফাইলের <code>const AUTH_HASH=...</code> লাইনের জায়গায় বসান, তারপর GitHub-এ auth.js আপডেট করুন।</p>
      <input id="line" readonly onclick="this.select()">
      <button id="copy" style="margin-top:10px;width:100%">কপি করুন</button>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <p><b>সহজ উপায়:</b> কপি-পেস্ট না করে নিচের বাটনে তৈরি করা পুরো <b>auth.js</b> ফাইলটা ডাউনলোড করুন, তারপর GitHub-এ পুরোনো auth.js-এর জায়গায় আপলোড করুন।</p>
      <button id="dl" class="primary" style="width:100%">⬇ নতুন auth.js ডাউনলোড</button>
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script>
const $=s=>document.querySelector(s);
$("#f").onsubmit=async e=>{
  e.preventDefault();
  const h=await makeHash($("#u").value,$("#p").value);
  $("#line").value=`const AUTH_HASH="${h}";`;
  $("#out").classList.remove("hidden");
};
$("#dl").onclick=async()=>{
  try{
    const src=await (await fetch("auth.js?"+Date.now())).text();
    const out=src.replace(/const AUTH_HASH="[0-9a-f]*";/,$("#line").value);
    if(out===src&&!src.includes($("#line").value))throw 0;
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([out],{type:"text/javascript"}));
    a.download="auth.js";a.click();URL.revokeObjectURL(a.href);
  }catch(e){alert("auth.js পড়া যায়নি। কপি করা লাইন পদ্ধতি ব্যবহার করুন।")}
};
$("#copy").onclick=()=>{navigator.clipboard.writeText($("#line").value);$("#copy").textContent="কপি হয়েছে ✓"};
</script>
</body>
</html>
