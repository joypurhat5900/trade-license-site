<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ট্রেড লাইসেন্স তথ্য</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#263746;font-family:Arial,sans-serif}
header{background:#164c70;color:white;text-align:center;padding:24px 12px}
main{max-width:760px;margin:24px auto;padding:0 14px}
.card{background:white;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0001}
input,button{width:100%;padding:12px;margin-top:10px;box-sizing:border-box;font-size:16px;border-radius:5px}
input{border:1px solid #bbc7d3}button{border:0;background:#176b49;color:white;cursor:pointer}
table{width:100%;border-collapse:collapse}td{padding:12px 7px;border-bottom:1px solid #ddd;overflow-wrap:anywhere;vertical-align:top}
td:first-child{font-weight:bold;width:40%}.notice{font-size:13px;color:#71551a;background:#fff4d6;padding:12px;border-radius:5px;line-height:1.6}
footer{text-align:center;padding:18px;color:#64748b;font-size:13px}
</style>
</head>
<body>
<header><h2>ট্রেড লাইসেন্সের তথ্য</h2><p>লাইসেন্স ID দিয়ে অনুসন্ধান করুন</p></header>
<main>
<div class="card">
<div class="notice">এটি একটি স্বাধীন তথ্য প্রদর্শনের ওয়েবসাইট; সরকারি যাচাইকরণ সাইট নয়।</div>
<form id="search"><label for="id">লাইসেন্স ID</label><input id="id" required placeholder="যেমন 1001"><button type="submit">তথ্য দেখুন</button></form>
</div>
<div class="card" id="result" hidden><h3>লাইসেন্সের বিবরণ</h3><table><tbody id="details"></tbody></table></div>
<div class="card" id="message">লাইসেন্স ID লিখে অনুসন্ধান করুন।</div>
</main>
<footer>স্বাধীন তথ্য প্রদর্শন সেবা</footer>
<script>
let records = new Map();
function parseCSV(text) {
  const rows=[]; let row=[], cell="", quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}
    else if(c===","&&!quoted){row.push(cell);cell="";}
    else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(v=>v.trim()!==""))rows.push(row);row=[];cell="";}
    else cell+=c;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  if(!rows.length)return [];
  const headers=rows.shift().map((h,i)=>(i===0?h.replace(/^\uFEFF/,""):h).trim());
  return rows.map(r=>{const obj={};headers.forEach((h,i)=>obj[h]=(r[i]||"").trim());return obj;});
}
async function loadData(){
  const response=await fetch("./licenses.csv");
  if(!response.ok)throw Error("CSV ফাইল পাওয়া যায়নি");
  const items=parseCSV(await response.text());
  for(const item of items){if(item.ID)records.set(item.ID,item);}
}
function showLicense(id){
  const item=records.get(id.trim());const result=document.getElementById("result");
  const message=document.getElementById("message");const details=document.getElementById("details");
  details.replaceChildren();
  if(!item){result.hidden=true;message.hidden=false;message.textContent="এই ID-এর কোনো তথ্য পাওয়া যায়নি।";return;}
  Object.entries(item).forEach(([key,value])=>{const tr=document.createElement("tr");const a=document.createElement("td");const b=document.createElement("td");a.textContent=key;b.textContent=value;tr.append(a,b);details.append(tr);});
  result.hidden=false;message.hidden=true;
}
document.getElementById("search").addEventListener("submit",e=>{
  e.preventDefault();const id=document.getElementById("id").value.trim();showLicense(id);
  const url=new URL(location.href);url.searchParams.set("id",id);history.replaceState(null,"",url);
});
loadData().then(()=>{
  const id=new URLSearchParams(location.search).get("id");
  if(id){document.getElementById("id").value=id;showLicense(id);}
}).catch(()=>{
  document.getElementById("message").textContent="তথ্য লোড হয়নি। licenses.csv ফাইলটি আপলোড করা আছে কি না দেখুন।";
});
</script>
</body>
</html>
